# 安卓构建 + 单元测试
#
# 这个仓库原来只有部署 docs/ 的 Pages 工作流，没有任何编译或测试 CI。
# 二开之后改动频繁，靠本地手动 assembleDebug（首次全量 20 分钟以上）不现实，
# 所以这里补一条最小链路：编译 debug 包 + 跑单元测试 + 上传测试报告。
#
# 为什么拆成两个 job：
# 原本 build + test 挤在一个 job 里，timeout 90 分钟。实测在 2 核 runner 上
# testDebugUnitTest 单步 25 分钟还没结束（Robolectric 要下 android-all jar），
# 加上 assembleDebug 已逼近 90 分钟悬崖。拆开后编译与测试各有独立预算。
#
# 为什么测试要分四片：
# 全量 349 个测试类，其中 ui.reader 一个包就 132 个。若用 com.huangder.lumibooks.**
# 做兜底片，那一片等于跑全量，其余片再快也没用——墙钟仍等于全量。
# 所以四片互不重叠，规模 61 / 77 / 79 / 132，墙钟≈全量的 38%。
# 代价是失去「新增包自动进入 CI」的特性，因此 build job 里加了覆盖率守门：
# 任何测试类若不在下列前缀内，CI 直接失败，逼你把它加进 matrix。
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次，避免排队占 runner
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. 编译 ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android@v3：它默认装 "tools platform-tools"，
      # 而遗留的 tools 包已从 SDK 仓库移除，sdkmanager 会 "Failed to find package 'tools'"
      # 并 exit 1，把整个 action 带崩。ubuntu-latest 镜像本身已带 cmdline-tools，直接用。
      # compileSdk 是 37，包名是 platforms;android-37.0（不是 android-37）
      - name: 安装 SDK 平台与构建工具
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager，检查 runner 镜像"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"
          # yes 在 --licenses 结束时会被 SIGPIPE，别让它把整个 step 带崩
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          echo "已安装版本："
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      # setup-gradle v6 默认 cache-provider=enhanced，会把**失败的 build** 也存成
      # `gradle-home-v2|<os>|build[<hash>]-<sha>` 缓存（实测只有 18KB）。Gradle 解析
      # 失败时会把「找不到该插件/构件」写进 modules-2 元数据，于是下一次重跑精确命中
      # 这条缓存后直接报 `Plugin [id: 'com.google.dagger.hilt.android'...] was not found`，
      # 60 秒内失败且完全不走网络——看起来像版本升级的锅，其实是中毒缓存。
      # 处理：删掉对应 caches 后重跑，别急着回退 action 版本。
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      # 这句 10 秒的打印是「JDK 迁移是否生效」的第一手证据。
      # backdrop 1.0.6 的 classes.jar 是 Java 21 字节码，JDK 17 加载即 UnsupportedClassVersionError，
      # 而这类错误在 8000 行日志里完全看不出真正的 JVM 版本。
      - name: 打印工具链版本
        run: |
          java -version
          ./gradlew --version | grep -E "Gradle|JVM" || true

      - name: 编译 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 下面这份前缀表必须与 unit-tests 的 matrix 保持一致。
      # 改了 matrix 忘了改这里 → 新包被漏跑但不报错；改了这里忘了改 matrix → 重复跑。
      # 两者都会在下一节的失败信息里暴露。
      - name: 守门：每个测试类都必须落在某个分片内
        run: |
          set -euo pipefail
          PREFIXES='
          com.huangder.lumibooks.ui.reader.
          com.huangder.lumibooks.ui.components.
          com.huangder.lumibooks.ui.bookshelf.
          com.huangder.lumibooks.ui.animation.
          com.huangder.lumibooks.ui.settings.
          com.huangder.lumibooks.ui.home.
          com.huangder.lumibooks.ui.theme.
          com.huangder.lumibooks.ui.welcome.
          com.huangder.lumibooks.ui.navigation.
          com.huangder.lumibooks.ui.excerpt.
          com.huangder.lumibooks.ui.icons.
          com.huangder.lumibooks.ui.layout.
          com.huangder.lumibooks.ui.statistics.
          com.huangder.lumibooks.widget.
          com.huangder.lumibooks.data.
          com.huangder.lumibooks.dictionary.
          com.huangder.lumibooks.domain.
          com.huangder.lumibooks.service.
          com.huangder.lumibooks.util.
          com.huangder.lumibooks.tts.
          com.huangder.lumibooks.translation.
          com.huangder.lumibooks.highlight.
          com.huangder.lumibooks.mineru.
          com.huangder.lumibooks.pdfconversion.
          '
          missing=0
          total=0
          while IFS= read -r f; do
            cls="${f#app/src/test/java/}"
            cls="${cls%.kt}"
            cls="${cls//\//.}"
            total=$((total + 1))
            ok=0
            for p in $PREFIXES; do
              case "$cls" in
                "$p"*) ok=1; break ;;
              esac
            done
            if [ "$ok" -eq 0 ]; then
              echo "::error::测试类未被任何分片覆盖：$cls —— 请把所在包加进 unit-tests 的 matrix 和本步骤的前缀表"
              missing=$((missing + 1))
            fi
          done < <(find app/src/test/java -name '*Test.kt')
          echo "共发现测试类 $total 个，未覆盖 $missing 个"
          [ "$missing" -eq 0 ] || exit 1

  # ── 2. 单元测试（四片互不重叠，并行）────────────────────────
  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # 一片挂了不要取消其他片，否则只看得到第一个失败
      fail-fast: false
      matrix:
        include:
          - shard: reader
            tests: "com.huangder.lumibooks.ui.reader.**"
          - shard: ui
            tests: "com.huangder.lumibooks.ui.components.**,com.huangder.lumibooks.ui.bookshelf.**,com.huangder.lumibooks.ui.animation.**,com.huangder.lumibooks.ui.settings.**,com.huangder.lumibooks.ui.home.**,com.huangder.lumibooks.ui.theme.**,com.huangder.lumibooks.ui.welcome.**,com.huangder.lumibooks.ui.navigation.**,com.huangder.lumibooks.ui.excerpt.**,com.huangder.lumibooks.ui.icons.**,com.huangder.lumibooks.ui.layout.**,com.huangder.lumibooks.ui.statistics.**,com.huangder.lumibooks.widget.**"
          - shard: data
            tests: "com.huangder.lumibooks.data.**,com.huangder.lumibooks.dictionary.**,com.huangder.lumibooks.domain.**,com.huangder.lumibooks.service.**"
          - shard: util
            tests: "com.huangder.lumibooks.util.**,com.huangder.lumibooks.tts.**,com.huangder.lumibooks.translation.**,com.huangder.lumibooks.highlight.**,com.huangder.lumibooks.mineru.**,com.huangder.lumibooks.pdfconversion.**"
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 SDK 平台与构建工具
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager，检查 runner 镜像"
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      # Gradle 的 --tests 不接受逗号分隔的多个模式（会被当成一个非法模式），
      # 必须展开成多个 --tests 参数。
      # continue-on-error：已知的 9 条上游既有失败（跨平台稳定失败，已用基线实验确认
      # 与本项目改动无关）不应该让 job 变红。真正的判定交给下一步的基线比对——
      # 它要求「失败集 ⊆ 基线」，出现新失败照样失败。若编译失败导致没有 XML，
      # 下一步同样会报错，不会被 continue-on-error 漏掉。
      - name: 单元测试（分片 ${{ matrix.shard }}）
        continue-on-error: true
        run: |
          set -euo pipefail
          ARGS=()
          IFS=',' read -ra PATS <<< "${{ matrix.tests }}"
          for p in "${PATS[@]}"; do
            ARGS+=(--tests "$p")
          done
          echo "测试过滤：${ARGS[*]}"
          ./gradlew :app:testDebugUnitTest "${ARGS[@]}" --stacktrace

      # 上一步 continue-on-error，已知的 9 条上游既有失败不会让 job 变红。
      # 这一步负责把它们和「新失败」区分开：失败集必须是基线子集，
      # 出现基线外的失败、或根本没有结果可判（测试没跑起来）都 exit 1。
      - name: 比对已知失败基线
        if: always()
        run: python3 .github/scripts/check-known-failures.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ matrix.shard }}
          # XML 是机器可读的那份：类名/方法名/system-out/system-err 都在里面。
          # 只传 HTML 时，失败信息只剩日志里被截断的一行 "XxxTest.kt:NN"，定位全靠猜。
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 14
