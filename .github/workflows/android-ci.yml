# 安卓构建 + 单元测试
#
# 这个仓库原来只有部署 docs/ 的 Pages 工作流，没有任何编译或测试 CI。
# 二开之后改动频繁，靠本地手动 assembleDebug（首次全量 20 分钟以上）不现实，
# 所以这里补一条最小链路：编译 debug 包 + 跑单元测试 + 上传测试报告。
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次，避免排队占 runner
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 是 37，包名是 platforms;android-37.0（不是 android-37）
      - name: 安装 SDK 平台与构建工具
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
